# JVM + Gradle
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# --- Jugaad Agent feature flags -------------------------------------------------
# Flip to true AFTER you have added the ExecuTorch AAR and the .pte model files
# (see ml/README.md). The app runs fine on the anomaly-only path when false.
jugaad.executorch.enabled=false
# Flip to true AFTER you have added the MediaPipe tasks-genai AAR and the Gemma
# .task model. When false, on-device advice uses the deterministic TemplateAdvisor.
jugaad.gemma.enabled=false
